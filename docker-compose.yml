services:

  postgres:
    image: postgres:16
    container_name: password-manager-postgres

    environment:
      POSTGRES_DB: password_manager
      POSTGRES_USER: password_admin
      POSTGRES_PASSWORD: change_me_dev_only

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: