spring.application.name=backend

# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/password_manager?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:password_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# AES-256 Secret Encryption Key
app.encryption.key=${APP_ENCRYPTION_KEY:PasswordManagerKey2026ABCD123456}
