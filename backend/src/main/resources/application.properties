spring.application.name=backend

# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Database Configuration (supports SPRING_DATASOURCE_* or DB_* env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/password_manager?options=-c%20TimeZone%3DUTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:password_admin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:change_me_dev_only}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Conservative HikariCP Pool Settings for Neon Serverless PostgreSQL
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# Flyway Controlled Schema Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA / Hibernate (validate schema against Flyway migrations)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Jackson Configuration for Hibernate Proxies
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Security & Encryption Configuration (override via environment variables in production)
app.encryption.key=${APP_ENCRYPTION_KEY:PasswordManagerKey2026ABCD123456}
app.jwt.secret=${JWT_SECRET:password-manager-secret-key-must-be-at-least-32-characters-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://arshitas16.github.io,http://localhost:5173,http://localhost:5174}

# Optional Secure Initial Admin Bootstrap (only runs when users table is empty)
app.admin.init.username=${ADMIN_INIT_USERNAME:}
app.admin.init.email=${ADMIN_INIT_EMAIL:}
app.admin.init.password=${ADMIN_INIT_PASSWORD:}
